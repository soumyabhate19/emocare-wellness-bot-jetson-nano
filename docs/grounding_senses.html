<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grounding: 5 Senses - EmoCare</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Source Sans 3', sans-serif;
    background: #CE7E5A;
    color: #4A2E10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  h1 {
    color: #F9E7B2;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    margin-bottom: 4px;
    text-align: center;
  }
  p.sub {
    color: #FDF6E3;
    margin-top: 0;
    margin-bottom: 26px;
    text-align: center;
    max-width: 420px;
  }
  #card {
    background: #66321F;
    border-radius: 16px;
    padding: 28px 24px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.15);
  }
  #step-count {
    font-size: 40px;
    font-weight: 700;
    color: #F9E7B2;
    margin-bottom: 4px;
  }
  #step-label {
    font-size: 17px;
    color: #FDF6E3;
    margin-bottom: 18px;
  }
  input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #D9BC7D;
    background: #F9E7B2;
    color: #4A2E10;
    font-size: 15px;
    margin-bottom: 14px;
  }
  #next-btn {
    background: #F9E7B2;
    color: #4A2E10;
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-weight: 700;
    cursor: pointer;
  }
  #next-btn:hover { background: #E8D794; }
  #progress {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 20px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: rgba(249,231,178,0.3);
  }
  .dot.done { background: #F9E7B2; }
  #done-msg {
    display: none;
    color: #F9E7B2;
    font-size: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<h1>🌬️ Grounding: 5 Senses</h1>
<p class="sub">A quick way to anchor back into the present moment.</p>

<div id="card">
  <div id="step-count">5</div>
  <div id="step-label">things you can SEE</div>
  <input id="entry" type="text" placeholder="Type one..." />
  <button id="next-btn">Next</button>
  <div id="progress"></div>
  <div id="done-msg">
    Nicely done. 🌿<br>
    You're here, right now, and that's enough.
  </div>
</div>

<script>
  const steps = [
    { n: 5, sense: "SEE" },
    { n: 4, sense: "TOUCH" },
    { n: 3, sense: "HEAR" },
    { n: 2, sense: "SMELL" },
    { n: 1, sense: "TASTE" },
  ];
  let stepIdx = 0;
  let countInStep = 0;

  const countEl = document.getElementById('step-count');
  const labelEl = document.getElementById('step-label');
  const entry = document.getElementById('entry');
  const nextBtn = document.getElementById('next-btn');
  const progress = document.getElementById('progress');
  const card = document.getElementById('card');
  const doneMsg = document.getElementById('done-msg');

  function renderProgress() {
    progress.innerHTML = '';
    steps.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i < stepIdx ? ' done' : '');
      progress.appendChild(d);
    });
  }

  function renderStep() {
    if (stepIdx >= steps.length) {
      card.querySelectorAll('#step-count, #step-label, input, #next-btn').forEach(el => el.style.display = 'none');
      doneMsg.style.display = 'block';
      renderProgress();
      return;
    }
    const s = steps[stepIdx];
    countEl.textContent = s.n - countInStep;
    labelEl.textContent = `things you can ${s.sense}`;
    entry.value = '';
    entry.focus();
    renderProgress();
  }

  function advance() {
    const val = entry.value.trim();
    if (!val) return;
    countInStep += 1;
    if (countInStep >= steps[stepIdx].n) {
      stepIdx += 1;
      countInStep = 0;
    }
    renderStep();
  }

  nextBtn.addEventListener('click', advance);
  entry.addEventListener('keydown', (e) => { if (e.key === 'Enter') advance(); });

  renderStep();
</script>
</body>
</html>
