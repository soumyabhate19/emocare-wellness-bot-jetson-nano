<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Counting Stars - EmoCare</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Source Sans 3', sans-serif;
    background: #CE7E5A;
    color: #4A2E10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 34px;
  }
  h1 {
    color: #F9E7B2;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    margin-bottom: 2px;
    text-align: center;
  }
  p.sub {
    color: #FDF6E3;
    margin-top: 0;
    margin-bottom: 16px;
    text-align: center;
    max-width: 420px;
  }

  #hud {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 12px;
  }
  #hud .stat {
    background: #F9E7B2;
    color: #4A2E10;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: 700;
  }

  #sky-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 360px;
    background: radial-gradient(circle at 30% 20%, #2A2A4A, #14142A 70%);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(0,0,0,0.25);
    border: 2px solid rgba(249,231,178,0.2);
  }

  .star {
    position: absolute;
    font-size: 26px;
    color: #F9E7B2;
    cursor: pointer;
    user-select: none;
    animation: twinkle-in 0.4s ease-out forwards;
    text-shadow: 0 0 10px rgba(249,231,178,0.8), 0 0 18px rgba(249,231,178,0.4);
  }
  @keyframes twinkle-in {
    from { opacity: 0; transform: scale(0.4) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .star.fading {
    animation: twinkle-out 0.6s ease-in forwards;
  }
  @keyframes twinkle-out {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.5); }
  }
  .star.popped {
    animation: pop 0.35s ease-out forwards;
    pointer-events: none;
  }
  @keyframes pop {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(1.8); }
  }

  #controls {
    margin-top: 16px;
    display: flex;
    gap: 10px;
  }
  button.pill {
    background: #66321F;
    color: #F9E7B2;
    border: none;
    border-radius: 10px;
    padding: 9px 20px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  button.pill:hover { background: #7A3F28; }
  button.pill.secondary { background: #F9E7B2; color: #4A2E10; }
  button.pill.secondary:hover { background: #E8D794; }

  .drift-cloud {
    position: absolute;
    color: rgba(255,255,255,0.06);
    font-size: 60px;
    pointer-events: none;
  }
</style>
</head>
<body>
<h1>✨ Counting Stars</h1>
<p class="sub">Tap each star before it fades. A gentle way to practice quiet focus — no rush, no penalty for missing one.</p>

<div id="hud">
  <div class="stat">Counted: <span id="count-val">0</span></div>
  <div class="stat">Missed: <span id="missed-val">0</span></div>
</div>

<div id="sky-wrap"></div>

<div id="controls">
  <button class="pill secondary" id="reset-btn">Reset Count</button>
  <button class="pill" id="pause-btn">⏸️ Pause</button>
</div>

<script>
  const sky = document.getElementById('sky-wrap');
  const countEl = document.getElementById('count-val');
  const missedEl = document.getElementById('missed-val');
  const resetBtn = document.getElementById('reset-btn');
  const pauseBtn = document.getElementById('pause-btn');

  let counted = 0;
  let missed = 0;
  let paused = false;
  let spawnTimer = null;

  const STAR_CHARS = ['★', '✦', '✧'];

  function spawnStar() {
    if (paused) return;

    const star = document.createElement('div');
    star.className = 'star';
    star.textContent = STAR_CHARS[Math.floor(Math.random() * STAR_CHARS.length)];

    const skyW = sky.clientWidth;
    const skyH = sky.clientHeight;
    const margin = 30;
    const x = margin + Math.random() * (skyW - margin * 2);
    const y = margin + Math.random() * (skyH - margin * 2);
    star.style.left = x + 'px';
    star.style.top = y + 'px';

    const lifetime = 2200 + Math.random() * 1400;
    let clicked = false;

    const fadeTimeout = setTimeout(() => {
      star.classList.add('fading');
      setTimeout(() => {
        if (!clicked && star.parentNode) {
          missed += 1;
          missedEl.textContent = missed;
        }
        star.remove();
      }, 600);
    }, lifetime - 600);

    star.addEventListener('click', () => {
      if (clicked) return;
      clicked = true;
      clearTimeout(fadeTimeout);
      star.classList.remove('fading');
      star.classList.add('popped');
      counted += 1;
      countEl.textContent = counted;
      setTimeout(() => star.remove(), 350);
    });

    sky.appendChild(star);
  }

  function scheduleNext() {
    if (paused) return;
    const delay = 500 + Math.random() * 700;
    spawnTimer = setTimeout(() => {
      spawnStar();
      scheduleNext();
    }, delay);
  }

  resetBtn.addEventListener('click', () => {
    counted = 0;
    missed = 0;
    countEl.textContent = 0;
    missedEl.textContent = 0;
  });

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶️ Resume' : '⏸️ Pause';
    if (!paused) scheduleNext();
    else clearTimeout(spawnTimer);
  });

  // gentle drifting background clouds for atmosphere
  for (let i = 0; i < 2; i++) {
    const cloud = document.createElement('div');
    cloud.className = 'drift-cloud';
    cloud.textContent = '☁';
    cloud.style.top = (20 + i * 140) + 'px';
    cloud.style.left = '-60px';
    sky.appendChild(cloud);
  }

  scheduleNext();
</script>
</body>
</html>
