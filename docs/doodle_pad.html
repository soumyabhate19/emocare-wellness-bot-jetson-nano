<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doodle Pad - EmoCare</title>
<script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Source Sans 3', sans-serif;
    background: #CE7E5A;
    color: #4A2E10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 16px 34px;
  }
  h1 {
    color: #F9E7B2;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    margin-bottom: 2px;
    text-align: center;
  }
  p.sub {
    color: #FDF6E3;
    margin-top: 0;
    margin-bottom: 16px;
    text-align: center;
    max-width: 420px;
  }

  #prompt-card {
    background: #66321F;
    color: #F9E7B2;
    border-radius: 14px;
    padding: 14px 22px;
    text-align: center;
    margin-bottom: 16px;
    min-width: 240px;
  }
  #prompt-card .label {
    font-size: 12px;
    opacity: 0.8;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  #prompt-word {
    font-size: 26px;
    font-weight: 700;
    margin-top: 2px;
  }

  canvas#pad {
    background: #FFFFFF;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    touch-action: none;
    cursor: crosshair;
  }

  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button.pill {
    background: #66321F;
    color: #F9E7B2;
    border: none;
    border-radius: 10px;
    padding: 9px 18px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  button.pill:hover { background: #7A3F28; }
  button.pill:disabled { opacity: 0.45; cursor: default; }
  button.pill.secondary { background: #F9E7B2; color: #4A2E10; }
  button.pill.secondary:hover { background: #E8D794; }

  #status {
    margin-top: 10px;
    font-size: 14px;
    color: #FDF6E3;
    min-height: 20px;
    text-align: center;
  }

  #result-card {
    margin-top: 14px;
    background: #F9E7B2;
    color: #4A2E10;
    border-radius: 14px;
    padding: 14px 20px;
    max-width: 340px;
    text-align: center;
    display: none;
  }
  #verdict {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  #verdict.correct { color: #2E7D4F; }
  #verdict.incorrect { color: #B0413E; }
  #guesses {
    font-size: 13px;
    opacity: 0.85;
    line-height: 1.5;
  }

  #score {
    margin-top: 10px;
    font-size: 13px;
    color: #FDF6E3;
    opacity: 0.9;
  }
</style>
</head>
<body>
<h1>🎨 Doodle Pad</h1>
<p class="sub">Draw the word below — a real AI (trained on millions of doodles) will guess what it is.</p>

<div id="prompt-card">
  <div class="label">Draw this:</div>
  <div id="prompt-word">…</div>
</div>

<canvas id="pad" width="320" height="320"></canvas>

<div id="toolbar">
  <button class="pill secondary" id="clear-btn">Clear</button>
  <button class="pill" id="check-btn" disabled>Loading AI…</button>
  <button class="pill secondary" id="next-btn">New Word</button>
</div>

<div id="status"></div>

<div id="result-card">
  <div id="verdict"></div>
  <div id="guesses"></div>
</div>

<div id="score">Score: <span id="score-val">0</span> correct out of <span id="tries-val">0</span></div>

<script>
  const PROMPTS = [
    "apple", "banana", "cat", "dog", "car", "bicycle", "umbrella",
    "cup", "key", "shoe", "star", "sun", "cloud", "fish", "flower",
    "book", "chair", "tree", "house", "clock", "spoon", "fork",
    "hat", "ice cream", "pizza", "backpack", "candle", "envelope",
    "scissors", "toothbrush",
  ];

  let currentPrompt = "";
  let usedRecently = [];
  let classifier = null;
  let score = 0;
  let tries = 0;

  const canvas = document.getElementById('pad');
  const ctx = canvas.getContext('2d');
  const promptEl = document.getElementById('prompt-word');
  const statusEl = document.getElementById('status');
  const checkBtn = document.getElementById('check-btn');
  const clearBtn = document.getElementById('clear-btn');
  const nextBtn = document.getElementById('next-btn');
  const resultCard = document.getElementById('result-card');
  const verdictEl = document.getElementById('verdict');
  const guessesEl = document.getElementById('guesses');
  const scoreValEl = document.getElementById('score-val');
  const triesValEl = document.getElementById('tries-val');

  function clearCanvas() {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function pickPrompt() {
    let choices = PROMPTS.filter(p => !usedRecently.includes(p));
    if (choices.length === 0) {
      usedRecently = [];
      choices = PROMPTS;
    }
    const word = choices[Math.floor(Math.random() * choices.length)];
    usedRecently.push(word);
    if (usedRecently.length > 8) usedRecently.shift();
    return word;
  }

  function newRound() {
    currentPrompt = pickPrompt();
    promptEl.textContent = currentPrompt;
    clearCanvas();
    resultCard.style.display = 'none';
    statusEl.textContent = '';
  }

  clearBtn.addEventListener('click', () => {
    clearCanvas();
    resultCard.style.display = 'none';
  });

  nextBtn.addEventListener('click', newRound);

  // ---------- Drawing (black pen only, for reliable AI recognition) ----------
  let drawing = false;
  let last = null;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const point = e.touches ? e.touches[0] : e;
    return {
      x: (point.clientX - rect.left) * scaleX,
      y: (point.clientY - rect.top) * scaleY,
    };
  }
  function start(e) { drawing = true; last = getPos(e); }
  function move(e) {
    if (!drawing) return;
    const p = getPos(e);
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    e.preventDefault();
  }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start);
  canvas.addEventListener('touchmove', move);
  window.addEventListener('touchend', end);

  // ---------- AI model ----------
  function modelReady() {
    statusEl.textContent = '';
    checkBtn.disabled = false;
    checkBtn.textContent = 'Check My Drawing';
  }

  function normalize(label) {
    return label.toLowerCase().trim();
  }

  function gotResults(error, results) {
    checkBtn.disabled = false;
    checkBtn.textContent = 'Check My Drawing';

    if (error) {
      statusEl.textContent = 'The AI had trouble looking at this — try again.';
      console.error(error);
      return;
    }

    tries += 1;
    const top3 = results.slice(0, 3);
    const target = normalize(currentPrompt);

    const isMatch = top3.some(r => {
      const label = normalize(r.label);
      return label === target || label.includes(target) || target.includes(label);
    });

    if (isMatch) score += 1;
    scoreValEl.textContent = score;
    triesValEl.textContent = tries;

    resultCard.style.display = 'block';
    verdictEl.className = isMatch ? 'correct' : 'incorrect';
    verdictEl.textContent = isMatch
      ? '✅ Correct! The AI recognized it.'
      : '🤔 Not quite — but nice drawing!';

    guessesEl.innerHTML = "AI's top guesses:<br>" + top3.map(r =>
      `${r.label} (${Math.round(r.confidence * 100)}%)`
    ).join(' · ');
  }

  checkBtn.addEventListener('click', () => {
    checkBtn.disabled = true;
    checkBtn.textContent = 'Thinking…';
    resultCard.style.display = 'none';
    classifier.classify(canvas, gotResults);
  });

  // ---------- Init ----------
  +
  clearCanvas();
  newRound();
  statusEl.textContent = 'Loading AI model… (a few seconds)';

  try {
    classifier = ml5.imageClassifier('DoodleNet', modelReady);
  } catch (e) {
    statusEl.textContent = 'Could not load the AI model. Check your connection and reload.';
    console.error(e);
  }
</script>
</body>
</html>
