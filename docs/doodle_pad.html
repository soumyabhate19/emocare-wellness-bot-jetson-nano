<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Doodle Pad - EmoCare</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap');
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Source Sans 3', sans-serif;
    background: #CE7E5A;
    color: #4A2E10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 30px;
  }
  h1 {
    color: #F9E7B2;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
    margin-bottom: 4px;
    text-align: center;
  }
  p.sub {
    color: #FDF6E3;
    margin-top: 0;
    margin-bottom: 18px;
    text-align: center;
    max-width: 420px;
  }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .swatch {
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.active { border-color: #66321F; }
  #clear-btn {
    background: #66321F;
    color: #F9E7B2;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #clear-btn:hover { background: #7A3F28; }
  canvas {
    background: #FDF6E3;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    touch-action: none;
    max-width: 92vw;
  }
</style>
</head>
<body>
<h1>🎨 Doodle Pad</h1>
<p class="sub">No goal here — just let your hand move.</p>

<div id="toolbar">
  <div class="swatch active" style="background:#66321F" data-color="#66321F"></div>
  <div class="swatch" style="background:#CE7E5A" data-color="#CE7E5A"></div>
  <div class="swatch" style="background:#D9BC7D" data-color="#D9BC7D"></div>
  <div class="swatch" style="background:#8FAE9C" data-color="#8FAE9C"></div>
  <div class="swatch" style="background:#7C9CBF" data-color="#7C9CBF"></div>
  <button id="clear-btn">Clear</button>
</div>

<canvas id="pad" width="480" height="420"></canvas>

<script>
  const canvas = document.getElementById('pad');
  const ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 5;
  let color = '#66321F';
  let drawing = false;
  let last = null;

  document.querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      color = sw.dataset.color;
    });
  });

  document.getElementById('clear-btn').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const point = e.touches ? e.touches[0] : e;
    return {
      x: (point.clientX - rect.left) * scaleX,
      y: (point.clientY - rect.top) * scaleY,
    };
  }

  function start(e) {
    drawing = true;
    last = getPos(e);
  }
  function move(e) {
    if (!drawing) return;
    const p = getPos(e);
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    e.preventDefault();
  }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start);
  canvas.addEventListener('touchmove', move);
  window.addEventListener('touchend', end);
</script>
</body>
</html>
